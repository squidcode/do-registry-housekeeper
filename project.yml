targetNamespace: ''
parameters: {}
environment:
  DO_API_TOKEN: ${DO_API_TOKEN}
  DO_REGISTRY_NAME: ${DO_REGISTRY_NAME}
  MAX_TAGS_TO_KEEP: ${MAX_TAGS_TO_KEEP}
  DRY_RUN: ${DRY_RUN}
packages:
  - name: registry-housekeeper
    environment: {}
    parameters: {}
    annotations: {}
    functions:
      - name: housekeeper
        binary: false
        main: ''
        runtime: nodejs:18
        web: false
        parameters: {}
        environment: {}
        annotations: {}
        limits:
          timeout: 120000
          memory: 256
        # weekly; the registry GC that frees the space is a separate step (registry read-only ~1-2 h)
        triggers:
          - name: weekly-housekeeping
            sourceType: scheduler
            sourceDetails:
              cron: '0 3 * * 0'
